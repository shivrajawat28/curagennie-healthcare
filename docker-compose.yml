services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: curagennie-backend
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8001
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - DATABASE_URL=sqlite:////app/data/curagennie.db
    volumes:
      - backend-db:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: curagennie-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-db:
    driver: local
